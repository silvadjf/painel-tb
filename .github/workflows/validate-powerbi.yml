name: Validate Power BI project

on:
  push:
    paths:
      - 'powerbi/**'
      - 'tools/validar_powerbi.py'
      - 'tools/critico_powerbi.py'
      - 'docs/fonte_da_verdade.md'
      - 'docs/metodologia.md'
      - '.github/workflows/validate-powerbi.yml'
  pull_request:
    paths:
      - 'powerbi/**'
      - 'tools/validar_powerbi.py'
      - 'tools/critico_powerbi.py'
      - 'docs/fonte_da_verdade.md'
      - 'docs/metodologia.md'
      - '.github/workflows/validate-powerbi.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Preflight JSON syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bad = []
          for p in Path('powerbi').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for path, err in bad:
              print(f'INVALID JSON: {path}: {err}')
          if bad:
              raise SystemExit(1)
          print('All *.json files parse successfully')
          PY

      - name: Run bounded critic
        if: success()
        run: python tools/critico_powerbi.py

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-validation
          path: |
            docs/validacao_powerbi.json
            docs/relatorio_critico.md
            docs/municipios_presentes.csv
          if-no-files-found: warn
