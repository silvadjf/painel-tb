name: Validate Power BI project

on:
  push:
    paths:
      - 'powerbi/**'
      - 'tools/validar_powerbi.py'
      - 'tools/critico_powerbi.py'
      - 'tools/gerar_municipios_presentes.py'
      - 'docs/fonte_da_verdade.md'
      - 'docs/metodologia.md'
      - '.github/workflows/validate-powerbi.yml'
  pull_request:
    paths:
      - 'powerbi/**'
      - 'tools/validar_powerbi.py'
      - 'tools/critico_powerbi.py'
      - 'tools/gerar_municipios_presentes.py'
      - 'docs/fonte_da_verdade.md'
      - 'docs/metodologia.md'
      - '.github/workflows/validate-powerbi.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          npm install -g @microsoft/powerbi-report-authoring-cli@latest

      - name: Preflight JSON syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bad = []
          for p in Path('powerbi').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append((str(p), str(e)))
          for path, err in bad:
              print(f'INVALID JSON: {path}: {err}')
          if bad:
              raise SystemExit(1)
          print('All *.json files parse successfully')
          PY

      - name: Validate PBIR with Microsoft CLI
        run: powerbi-report-author validate powerbi/PainelTB.Report

      - name: Run bounded critic
        run: python tools/critico_powerbi.py

      - name: Generate complete municipality truth list
        run: python tools/gerar_municipios_presentes.py

      - name: Commit generated municipality list
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- docs/municipios_presentes.csv; then
            echo 'Municipality list unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/municipios_presentes.csv
          git commit -m 'docs(powerbi): refresh municipality source-of-truth list'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-validation
          path: |
            docs/validacao_powerbi.json
            docs/relatorio_critico.md
            docs/municipios_presentes.csv
          if-no-files-found: warn
